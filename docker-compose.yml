services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run start
    ports:
      - "127.0.0.1:3003:3003"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped
    stop_grace_period: 40s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3003/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
    depends_on: []

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run worker
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run scheduler
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  mysql:
    image: mariadb:11.4
    profiles: ["local-db"]
    environment:
      MYSQL_DATABASE: witch
      MYSQL_USER: witch
      MYSQL_PASSWORD: witch
      MYSQL_ROOT_PASSWORD: witch
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - witch-mysql:/var/lib/mysql

volumes:
  witch-mysql:
